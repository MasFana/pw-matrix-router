name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libvulkan-dev

      - name: Build
        run: cargo build --release --locked --bin pw-matrix-router

      - name: Build packages
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          APPIMAGETOOL="$tool" bash packaging/build.sh
          ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
            dist/sha256sums.txt
          body: |
            Linux builds for x86_64. Pick the format your distribution uses:

            | Format | File | Install |
            | --- | --- | --- |
            | Debian, Ubuntu, Mint | `pw-matrix-router_<version>_amd64.deb` | `sudo apt install ./file.deb` |
            | Fedora, openSUSE, RHEL | `pw-matrix-router-<version>-1.x86_64.rpm` | `sudo dnf install ./file.rpm` |
            | Any distribution | `pw-matrix-router-<version>-x86_64.AppImage` | `chmod +x file.AppImage && ./file.AppImage` |
            | Any distribution, manual | `pw-matrix-router-<version>-x86_64-linux.tar.gz` | extract, run `./pw-matrix-router` |

            Runtime requirements: PipeWire, and `pactl`, `parec`, `pacat` from the PulseAudio utilities. AppStream metadata and desktop entry are included in the deb, rpm, and AppImage.

            `sha256sums.txt` covers every asset.

            See CHANGELOG.md for user-visible changes.