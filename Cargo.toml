[package]
name = "pw-matrix-router"
version = "0.1.1"
edition = "2024"
description = "PipeWire audio router for Linux: one stereo source to many outputs at their own sample rates"
repository = "https://github.com/MasFana/pw-matrix-router"
readme = "README.md"
license = "MIT"
authors = ["MasFana"]
keywords = ["pipewire", "audio", "router", "resampling", "linux"]
categories = ["multimedia::audio", "gui"]

[lib]
name = "pw_matrix_router"
path = "src/lib.rs"

[dependencies]
# GPUI Kit (native desktop UI framework)
gpui-kit = { version = "0.10", features = ["component", "assets"] }

# Linux audio control and persistence
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
signal-hook = "0.3"


[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.10", features = ["test-support"] }

# Portable runtime optimization; longer release builds/links than Cargo defaults.
# Thin LTO keeps cross-crate optimization cheaper than fat LTO; one codegen unit
# trades compile parallelism for optimization without CPU-specific instructions.
[profile.release]
lto = "thin"
codegen-units = 1